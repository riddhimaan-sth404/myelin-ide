[workspace]
members = [
    "crates/myelin-text",
    "crates/myelin-core",
    "crates/myelin-terminal",
    "crates/myelin-lsp",
    "crates/myelin-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Myelin IDE Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crop = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
csbindgen = "1.9"
portable-pty = "0.8"
